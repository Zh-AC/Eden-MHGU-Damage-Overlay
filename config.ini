; ============================================================
;  Eden MHGU Damage Overlay 配置文件
;  修改后重启插件生效
;  数值写错或超出安全范围不会导致插件崩溃, 会自动恢复默认/修正(见各条注释)
;  颜色格式: #RRGGBB 或 #RRGGBBAA(AA=透明度, FF=完全不透明)
; ============================================================

[Renderer]
; 伤害数字字体文件路径(留空自动用系统 Bahnschrift)
FontPath = C:\Windows\Fonts\bahnschrift.ttf
; 大怪伤害数字字号(像素)
FontSize = 70
; 是否显示伤害数字(0=否 1=是)
ShowDamageNumbers = 1
; 伤害数字颜色分级:
;   小伤害(40以下)显示 DamageColorLow  = 白色
;   中等伤害(40~79)显示 DamageColorMid = 黄色
;   大伤害(80+)显示 DamageColorHigh    = 橙色
DamageColorLow = #FFFFFF
DamageColorMid = #FFD93B
DamageColorHigh = #E49124
; 分级边界(可调): 伤害 < DamageThresholdMid 算小伤害, >= DamageThresholdHigh 算大伤害
DamageThresholdMid = 40
DamageThresholdHigh = 80
; 数字出现位置(锚点, 屏幕比例 0.0~1.0):
;   AnchorXRatio = 0.5 屏幕水平中央, 0 左边缘, 1 右边缘
;   AnchorYRatio = 0.5 屏幕垂直中央, 0 顶部, 1 底部
AnchorXRatio = 0.5
AnchorYRatio = 0.5
; 小怪伤害数字: 字号比例(0.6 = 大怪的60%)和最大不透明度(0.65 = 65%)
SmallFontScale = 0.6
SmallOpacity = 0.65
; 数字阴影
DamageShadowEnabled = 1
DamageShadowColor = #000000D9
DamageShadowOffsetX = 2
DamageShadowOffsetY = 2
DamageShadowThickness = 3

[Logic]
; 数字停留时间(帧, 60帧=1秒)
Lifetime = 90
; 淡出动画时长(帧)
FadeTime = 30
; 数字重叠时的横向错开距离(像素)
XStaggerStep = 45
; 同屏最大数字数量
OverlapMax = 10

[Scanner]
; 忽略 HP 上限(防误判)
HpMaxLimit = 70000
; 扫描间隔(毫秒), 允许 50~5000: 数字越大数字刷新越慢(超过 5000 会自动拉回)
ScanIntervalMs = 50
; 模拟器进程名
EmulatorProcess = eden.exe
; 扫描内存区域(0 = 自动)
ScanRegionStart = 0
ScanRegionEnd = 0
; AOB 特征码(留空 = 使用内置默认)
AobPatterns =

